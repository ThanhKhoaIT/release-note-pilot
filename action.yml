name: "Release Note Pilot"
description: "Generate business-friendly release notes from merged commits/PRs and post them to Slack"
branding:
  icon: "message-square"
  color: "purple"

inputs:
  repo:
    description: "owner/repo (default: current repository)"
    required: false
    default: ${{ github.repository }}
  from_ref:
    description: "Ref before this deploy (default: github.event.before)"
    required: false
    default: ${{ github.event.before }}
  to_ref:
    description: "Ref being deployed (default: github.sha)"
    required: false
    default: ${{ github.sha }}
  github_token:
    description: "Token used to call the GitHub API"
    required: true
  gemini_api_key:
    description: "Gemini API key"
    required: true
  slack_webhook_url:
    description: "Slack Incoming Webhook URL"
    required: true
  gemini_model:
    description: "Gemini model used to rewrite/classify entries"
    required: false
    default: "gemini-3.6-flash"
  languages:
    description: "Comma-separated language codes to generate the release note in (e.g. en,vi)"
    required: false
    default: "en"
  include_images:
    description: "Whether to include screenshots from PR descriptions as Slack image blocks"
    required: false
    default: "true"
  r2_account_id:
    description: >-
      Cloudflare account ID. Optional — set this together with r2_access_key_id,
      r2_secret_access_key, r2_bucket, and r2_public_url to re-host PR screenshots on R2, since
      GitHub's attachment URLs require an authenticated session and Slack can't load them directly.
    required: false
  r2_access_key_id:
    description: "Cloudflare R2 access key ID (see r2_account_id)"
    required: false
  r2_secret_access_key:
    description: "Cloudflare R2 secret access key (see r2_account_id)"
    required: false
  r2_bucket:
    description: "Cloudflare R2 bucket to upload re-hosted screenshots to (see r2_account_id)"
    required: false
  r2_public_url:
    description: >-
      Public base URL for the R2 bucket, e.g. an r2.dev dev URL or a custom domain, no trailing
      slash (see r2_account_id)
    required: false

runs:
  using: "node24"
  main: "dist/index.js"
